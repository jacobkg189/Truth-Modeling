[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jev-factchecker"
version = "0.1.0"
description = "Fast, evidence-grounded fact checking with TypeSafe's Jev as the decision model."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "typesafe-sdk>=0.7.4",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[project.scripts]
factcheck = "factchecker.cli:main"
factcheck-eval = "factchecker.eval:main"

[tool.setuptools]
packages = ["factchecker"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = ["live: calls the real Jev API and Wikipedia (needs TYPESAFE_API_KEY and network)"]
addopts = "-m 'not live'"
